name: 发版

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（如 4.1.1）；留空则直接用仓库里的 VERSION'
        required: false
        default: ''

# 发 Release 需要 contents: write；这是 GITHUB_TOKEN 的工作流级声明，不需要额外 scope。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 第一关：版本号一致性 ────────────────────────────────────────
  # tag 必须与 VERSION 完全相同，且 CHANGELOG 里必须已有该版本小节。
  # 这三条任何一条不满足就红着退出，不产出任何包。
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与 VERSION 一致
        id: v
        shell: bash
        run: |
          set -euo pipefail
          FILE_VER="$(tr -d '\r\n' < VERSION)"
          echo "仓库 VERSION = ${FILE_VER}"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            WANT="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            WANT="${GITHUB_REF_NAME#v}"
          else
            WANT=""
          fi

          if [ -n "${WANT}" ] && [ "${WANT}" != "${FILE_VER}" ]; then
            echo "::error::tag/输入版本 ${WANT} 与 VERSION ${FILE_VER} 不一致"
            exit 1
          fi

          if ! grep -q "^## \[${FILE_VER}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 [${FILE_VER}] 小节"
            exit 1
          fi

          IFS='.' read -r MA MI PA <<< "${FILE_VER}"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "version=${FILE_VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "版本 ${FILE_VER} / versionCode ${CODE} ✓"

  # ── 第二关：构建两个 ABI 包 ────────────────────────────────────
  build:
    needs: check-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - { key: arm64,     abi: 'arm64-v8a', suffix: 'arm64' }
          - { key: universal, abi: 'arm64-v8a,armeabi-v7a,x86_64', suffix: 'universal' }
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android@v3：
      # 它在 ubuntu-26.04 镜像上会 `sdkmanager tools` 失败（该包已被 Google 下架），
      # hosted 镜像本身就带完整 SDK，直接拿现成的更稳。
      - name: 使用镜像自带 Android SDK
        run: |
          set -euo pipefail
          # setup-java 的 with 里会把 ANDROID_HOME 置空，这里重新探测
          for cand in /usr/local/lib/android/sdk "${HOME}/Android/Sdk" "${ANDROID_SDK_ROOT:-}"; do
            if [ -n "${cand}" ] && [ -d "${cand}/platforms" ]; then
              echo "ANDROID_HOME=${cand}" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=${cand}" >> "$GITHUB_ENV"
              export ANDROID_HOME="${cand}"
              export ANDROID_SDK_ROOT="${cand}"
              echo "找到 SDK: ${cand}"
              break
            fi
          done
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::找不到 Android SDK"
            ls -d /usr/local/lib/android* 2>/dev/null || true
            exit 1
          fi
          echo "platforms:"; ls "${ANDROID_HOME}/platforms" || true
          echo "build-tools:"; ls "${ANDROID_HOME}/build-tools" || true
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1)"
          # 兜底：缺 platform 34 才补，能装就装，装不上就靠镜像自带的
          if ! ls "${ANDROID_HOME}/platforms" 2>/dev/null | grep -q 'android-3'; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" || true
          fi

      - name: 拉底座源码
        run: node scripts/prepare-base.js

      # 先确认底座真的落地，再动手改：
      # 上一轮 build.gradle.kts 报 ENOENT，是准备阶段的报错被后续步骤掩盖了。
      - name: 校验底座结构
        run: |
          set -euo pipefail
          B="build/base/legado"
          echo "== 顶层 =="; ls -la "$B" || true
          for f in settings.gradle app/build.gradle.kts gradlew; do
            if [ -e "$B/$f" ]; then echo "✓ $f"; else echo "✗ 缺 $f"; fi
          done
          test -f "$B/app/build.gradle.kts"
          echo "== 取一次 helps（暴露底座自身是否可配置） =="
          cd "$B" && chmod +x gradlew && ./gradlew -q projects --no-daemon || {
            echo "::error::gradlew 配置失败，见上方输出"; exit 1; }
          cd - > /dev/null

      - name: 注入本仓库资产
        run: node scripts/apply-patches.js

      # 底座版本号的真相是 app/version.properties，不是 build.gradle.kts
      - name: 落实版本号（底座 + 本仓库）
        run: |
          set -euo pipefail
          V="${{ needs.check-version.outputs.version }}"
          IFS='.' read -r MA MI PA <<< "$V"
          # versionCode 只能增不能减：底座默认 32640，取它与 MA*10000+MI*100+PA 的较大者
          WANT=$(( MA * 10000 + MI * 100 + PA ))
          BASE_DEFAULT=32640
          if [ "$WANT" -gt "$BASE_DEFAULT" ]; then CODE=$WANT; else CODE=$BASE_DEFAULT; fi
          echo "APP_VERSION_NAME=${V}" >> "$GITHUB_ENV"
          echo "COMMIT_NUMBER=${CODE}" >> "$GITHUB_ENV"
          echo "版本名 ${V} / versionCode ${CODE}"
          node scripts/patch-base-version.js "$V"
          node scripts/bump-version.js "$V"

      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks

      - name: 构建
        env:
          # 底座读的是 Gradle 属性（project.hasProperty），不是环境变量
          VERSION: ${{ needs.check-version.outputs.version }}
          ABI: ${{ matrix.flavor.abi }}
        run: |
          set -euo pipefail
          cd build/base/legado
          chmod +x gradlew
          # 变体名规则（底座 flavor = mode × engine）：
          #   app + core  = 基础版（无本地漫画引擎）→ appCoreRelease
          #   app + comic = 漫画增强版（带本地引擎，体积大）
          #   universal  = 基础版 + 通用 ABI 包（含 x86_64，模拟器可用）
          # 签名：底座在 hasProperty("RELEASE_STORE_FILE") 时才创建 signingConfig。
          case "${{ matrix.flavor.key }}" in
            arm64)     TASKS="assembleAppCoreRelease"; SPLITS=true ;;
            universal) TASKS="assembleAppCoreRelease"; SPLITS=true ;;
            *)         echo "::error::未知 flavor"; exit 1 ;;
          esac
          ./gradlew ${TASKS} --no-daemon \
            -PRELEASE_STORE_FILE="${GITHUB_WORKSPACE}/keystore/release.jks" \
            -PRELEASE_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            -PenableAbiSplits=${SPLITS} \
            -Dorg.gradle.jvmargs="-Xmx4g -Xms512m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            --no-configuration-cache

      - name: 定位产物
        run: |
          set -euo pipefail
          echo "== outputs 树 =="
          find build/base/legado/app/build/outputs -name '*.apk' -printf '%p  %k KB\n' || true

      - name: 收集产物并改名
        run: node scripts/collect-apk.js --suffix ${{ matrix.flavor.suffix }} --version ${{ needs.check-version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor.key }}
          path: dist/*.apk
          if-no-files-found: error

  # ── 第三关：签名校验 ───────────────────────────────────────────
  verify:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      - name: 验签 + 验 ABI + 验版本号
        run: |
          set -euo pipefail
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -n1)"
          echo "build-tools = ${BT}"
          for f in dist/*.apk; do
            echo "── $f"
            "${BT}apksigner" verify --print-certs "$f"
            "${BT}aapt2" dump badging "$f" | grep -E "package:|native-code"
            unzip -p "$f" classes.dex > /dev/null && echo "classes.dex 存在"
          done

  # ── 第四关：发布 ───────────────────────────────────────────────
  release:
    needs: [check-version, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }

      - name: 生成 SHA256
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 从 CHANGELOG 摘出本版说明
        shell: bash
        run: |
          V="${{ needs.check-version.outputs.version }}"
          awk -v v="## [$V]" 'index($0,v)==1{f=1;next} f&&/^## \[/{exit} f' CHANGELOG.md > release-notes.md
          {
            echo "APK 命名：\`阅读-番茄排版-<abi>-<版本>.apk\`"
            echo "包名：\`io.legato.kazusa\`（与 4.00.x 的 \`io.legado.app.release\` 不是同一个应用，需并存安装）"
            echo "签名：SHA-256 \`624e877f…42667f\`（与 4.00.x 同一把钥匙）"
            echo
            echo "校验：\`sha256sum -c SHA256SUMS.txt\`"
            echo
            cat release-notes.md
          } > body.md
          cat body.md

      # GitHub 存附件时会把文件名里的中文剥掉（阅读-番茄排版 -> "-.-"），
      # 而且它与显示名（label）共用同一条清洗规则，改哪个都一样。
      # 所以附件用纯 ASCII 名，Release 正文里给出「中文名 → 实际文件名」对照表。
      - name: 附件按 ASCII 名准备
        run: |
          set -euo pipefail
          V="${{ needs.check-version.outputs.version }}"
          mkdir -p up
          for f in dist/*.apk; do
            base="$(basename "$f")"
            abi="$(echo "$base" | sed -E 's/.*-(arm64|universal)-.*/\1/')"
            cp "$f" "up/reader-fanqie-${abi}-${V}.apk"
          done
          cp dist/SHA256SUMS.txt up/SHA256SUMS.txt
          ls -la up

      - name: 建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body_path: body.md
          draft: false
          prerelease: false
          files: |
            up/*.apk
            up/SHA256SUMS.txt

      - name: 回读附件清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ needs.check-version.outputs.version }}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${V}" \
            --jq '.assets[] | "\(.name)  \(.size) 字节"'